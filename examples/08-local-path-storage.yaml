# Per-node persistent storage for the k3s local-path StorageClass.
#
# Every container gets a host directory bind-mounted at
# /var/lib/rancher/k3s/storage (the local-path-provisioner default):
#   /data/k3s-storage/store/store-main1  ->  CT 5800:/var/lib/rancher/k3s/storage
#   /data/k3s-storage/store/store-node1  ->  CT 5801:/var/lib/rancher/k3s/storage
#   /data/k3s-storage/store/store-node2  ->  CT 5802:/var/lib/rancher/k3s/storage
#
# PVCs with storageClassName: local-path then store their data on the
# Proxmox host. The data survives `pk3s destroy` (directories are never
# deleted automatically) but is NOT included in vzdump backups of the
# containers: back up /data/k3s-storage separately.
#
# Test it with manifests/local-path-pvc-test.yaml.
name: store
servers: 1
agents: 2
ctid_start: 5800
template:
  storage: local
  name: debian-13-standard_13.1-2_amd64.tar.zst
rootfs_storage: x-data
server_resources: {cores: 2, memory_mib: 4096, disk_gib: 30}
agent_resources: {cores: 2, memory_mib: 4096, disk_gib: 30}
network:
  bridge: vmbr0
  first_ip: 192.168.0.56
  prefix: 24
  gateway: 192.168.0.1
  dns: [192.168.0.2]
security:
  profile: privileged
  acknowledge_privileged_risk: true
persistent_data:
  enabled: true
  host_path: /data/k3s-storage
