# Applied by pk3s (internal/k3s/sharedmanifest.go) when spec.shared_data is
# enabled. Keep this in sync with examples/manifests/local-shared/
# provisioner.yaml and storageclass.yaml, which document and manually test
# the same setup.
#
# A dedicated local-path-provisioner instance for the `local-shared`
# StorageClass, using upstream's "shared filesystem" mode:
# https://github.com/rancher/local-path-provisioner#configuration
#
# k3s already bundles its own local-path-provisioner (namespace kube-system,
# provisioner rancher.io/local-path, backing the `local-path` StorageClass).
# k3s reconciles that one from its own embedded manifests, so this is a
# second, independent instance in its own namespace with its own
# provisioner name - editing the bundled one would just get reverted.
#
# This provisioner's config.json sets "sharedFileSystemPath" instead of
# "nodePathMap": it expects the SAME host directory to be bind-mounted at
# the same path (k3s.SharedStoragePath, /k3s-shared) on every node, which
# pk3s does when spec.shared_data is enabled. In that mode the provisioner
# supports ReadWriteOnce, ReadOnlyMany AND ReadWriteMany, with no node
# affinity on the PVs it creates.
#
# For each PVC it creates a subdirectory under /k3s-shared named
# <pv-name>_<namespace>_<pvc-name>; deleting the PVC deletes it
# (reclaimPolicy: Delete, set on the StorageClass below).
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-shared-provisioner-service-account
  namespace: local-path-storage

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: local-shared-provisioner-role
  namespace: local-path-storage
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-shared-provisioner-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: local-shared-provisioner-bind
  namespace: local-path-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: local-shared-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-shared-provisioner-service-account
    namespace: local-path-storage

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-shared-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-shared-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-shared-provisioner-service-account
    namespace: local-path-storage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-shared-provisioner
  namespace: local-path-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-shared-provisioner
  template:
    metadata:
      labels:
        app: local-shared-provisioner
    spec:
      serviceAccountName: local-shared-provisioner-service-account
      containers:
        - name: local-shared-provisioner
          image: docker.io/rancher/local-path-provisioner:v0.0.37
          imagePullPolicy: IfNotPresent
          # --configmap-name must match the ConfigMap below by name: the
          # provisioner re-reads config.json from the mounted volume, but
          # fetches helperPod.yaml through the API using this flag (default
          # "local-path-config"), not from the volume mount.
          command:
            - local-path-provisioner
            - --debug
            - start
            - --config
            - /etc/config/config.json
            - --configmap-name
            - local-shared-config
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
            - name: HEALTH_PORT
              value: "8080"
            - name: PROVISIONER_NAME
              value: rancher.io/local-shared
            # Must match the ServiceAccount above: the provisioner uses
            # this to build the helper pod it launches per PVC create/
            # delete, independently of the pod's own serviceAccountName.
            - name: SERVICE_ACCOUNT_NAME
              value: local-shared-provisioner-service-account
      volumes:
        - name: config-volume
          configMap:
            name: local-shared-config

---
kind: ConfigMap
apiVersion: v1
metadata:
  name: local-shared-config
  namespace: local-path-storage
data:
  config.json: |-
    {
            "nodePathMap":[],
            "sharedFileSystemPath": "/k3s-shared"
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
      - name: helper-pod
        image: docker.io/library/busybox
        imagePullPolicy: IfNotPresent

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-shared
provisioner: rancher.io/local-shared
volumeBindingMode: Immediate
reclaimPolicy: Delete
